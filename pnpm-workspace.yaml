packages:
  - frontend

allowBuilds:
  simple-git-hooks: true

minimumReleaseAgeExclude:
  - '@solidjs/signals@2.0.3'
  - '@solidjs/web@2.0.3'
  - solid-js@2.0.3

overrides:
  typescript: npm:typescript-native-bridge@6.0.3-bridge.19.tsgo.7.0.2

permissions:
  '@solidjs/web':
    skills: true
  solid-js:
    skills: [reactivity-diagnostics, solid-2.0, solid-2.0-cheatsheet]

skills:
  dirs:
    - .agent/skills
    - .agents/skills
    - .claude/skills
    - .cursor/skills
    - .gemini/skills
    - .github/skills
